[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-memory"
version = "0.2.0"
description = "Portable semantic memory layer for LLM agents over MCP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.4",
    "fastmcp>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
# the original ChromaDB backend (SHARED_MEMORY_BACKEND=chroma) and the migration script
chroma = ["chromadb>=0.5"]
dev = ["pytest", "ruff", "chromadb>=0.5"]

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines in docstrings/comments are fine
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
